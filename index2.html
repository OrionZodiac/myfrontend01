<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          inter: ['Inter', 'sans-serif'],
          playfair: ['"Playfair Display"', 'serif'],
        },
      },
    },
  }
</script>
</head>

<body class="bg-black text-white font-inter">

  <div class="mx-auto px-6 md:px-10">

    <!-- NAVBAR -->
    <nav class="flex flex-col md:flex-row items-center justify-between gap-4 py-5">
      <div class="text-2xl font-bold tracking-tight">
        <span class="text-green-500">&gt;_</span>ApisiT SAU
      </div>

      <div class="flex items-center gap-6 md:gap-8">
        <a href="#" class="text-yellow-400 font-medium transition hover:text-yellow-300">Home</a>
        <a href="#" class="font-medium transition hover:text-yellow-400">About</a>
        <a href="#" class="font-medium transition hover:text-yellow-400">Portfolio</a>
        <a href="#" class="rounded-full border border-white px-6 py-2.5 text-sm font-medium transition hover:bg-white hover:text-black">
          Let's talk
        </a>
      </div>
    </nav>

    <!-- HERO -->
    <section class="flex flex-col-reverse md:flex-row items-center justify-center gap-10 md:gap-16 py-8 md:py-12">

      <!-- ข้อความ -->
      <div class="max-w-md text-center md:text-left">
        <h1 class="font-playfair text-4xl md:text-5xl font-black leading-tight mb-5">
          Full Stack Web Developer !
        </h1>

        <p class="text-neutral-300 leading-relaxed mb-7">
          Hi, I'm ApisiT SAU. A passionate Full Stack Web Developer based in Thailand.
        </p>

        <div class="flex justify-center md:justify-start gap-3.5">
          <a href="#" class="grid h-11 w-11 place-items-center rounded-full bg-white text-lg text-black transition hover:-translate-y-1 hover:bg-yellow-400">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="grid h-11 w-11 place-items-center rounded-full bg-white text-lg text-black transition hover:-translate-y-1 hover:bg-yellow-400">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>

      <!-- รูปโปรไฟล์ + แสงเรืองหลัง -->
      <div class="relative shrink-0">
        <div class="bg-black"></div>
        <img src="./images/leo.jpg" alt="Profile"
             class="h-64 w-64 md:h-96 md:w-96 rounded-full object-cover">
      </div>

    </section>

    <!-- TECH STACKS -->
    <section class="pb-16 text-center">
      <h3 class="mb-6 text-base font-bold">My Tech Stacks</h3>

      <div class="flex flex-wrap items-center justify-center gap-6 md:gap-9 text-3xl md:text-4xl">
        <i class="devicon-html5-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-css3-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-javascript-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-nodejs-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-react-original colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-spring-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-java-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-figma-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
        <i class="devicon-firebase-plain colored transition hover:-translate-y-1.5 hover:scale-110"></i>
      </div>
    </section>

  </div>

</body>
</html>
